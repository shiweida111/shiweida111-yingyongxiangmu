<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>驭影 - 视觉取证决策系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8fafc; font-family: 'PingFang SC', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .hero { background: #fff; padding: 60px 0; border-bottom: 1px solid #e2e8f0; text-align: center; }
        .card-nav { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; transition: 0.3s; cursor: pointer; height: 100%; padding: 40px; }
        .card-nav:hover { transform: translateY(-5px); border-color: #1a569d; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .icon-box { width: 60px; height: 60px; background: rgba(26,86,157,0.1); color: #1a569d; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 20px; }
        footer { margin-top: auto; padding: 20px; background: #fff; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="hero">
        <h2 class="fw-bold">视觉证据提取与分析决策智能体</h2>
        <p class="text-muted">驭影取证：集规则、模型与认知于一体的智能化图像研判平台</p>
    </div>
    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4" onclick="location.href='/agent/rule'">
                <div class="card-nav text-center">
                    <div class="icon-box"><i class="bi bi-shield-check"></i></div>
                    <h5>规则引导引擎</h5>
                    <p class="small text-muted">快速物理特征筛查</p>
                </div>
            </div>
            <div class="col-md-4" onclick="location.href='/agent/ml'">
                <div class="card-nav text-center">
                    <div class="icon-box"><i class="bi bi-diagram-3"></i></div>
                    <h5>机器学习引擎</h5>
                    <p class="small text-muted">机器学习深度逻辑推理</p>
                </div>
            </div>
            <div class="col-md-4" onclick="location.href='/agent/llm'">
                <div class="card-nav text-center">
                    <div class="icon-box"><i class="bi bi-robot"></i></div>
                    <h5>大模型引擎</h5>
                    <p class="small text-muted">多模态语义取证识别</p>
                </div>
            </div>
        </div>
    </div>
    <footer>© 2025 中国人民公安大学 - 打防网络犯罪工程技术研究中心 版权所有</footer>
</body>
</html>
